name: Build and Deploy
on:
  workflow_dispatch: {}
  push:
    branches:
      - web-port
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  pages: write

jobs:
  build:
    name: Build 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Pack .love file
        run: npm run pack

      - name: Build web (love.js)
        run: npm run build

      - name: Compress .love for release
        run: zip FotD-love.zip FotD.love

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-build
          path: Web/

      - name: Upload .love artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotD-love
          path: FotD-love.zip

  release_rolling:
    name: 🔄 Refresh latest-main release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/web-port'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete previous latest-main release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Publish rolling latest-main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: 'Latest build'
          prerelease: true
          make_latest: 'false'
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `web-port` at commit `${{ github.sha }}`.
          files: dist/FotD-love.zip

  release_tag:
    name: 🏷️ Create tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Fear of the Dark ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/FotD-love.zip

  deploy:
    name: Deploy to GitHub Pages 🕸️
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/web-port'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: Web-build
          path: Web

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r .github/pages/* site/
          mv Web site/Web
          cp CHANGELOG.md site/ 2>/dev/null || true
          cp -r docs site/docs 2>/dev/null || true
          cp -r assets site/assets

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: site
